name: Build PDV Desktop

# O build local do Electron trava nesta maquina: extrair o winCodeSign-2.6.0.7z (usado
# pelo electron-builder mesmo so pra gerar .exe do Windows, nao so pra assinar Mac) exige
# privilegio de criar link simbolico, que exige Modo de Desenvolvedor ou admin -- bloqueado
# por politica corporativa. O runner do GitHub roda sem essa restricao, entao o build aqui
# funciona sem precisar mexer em nada da maquina local.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pdv-desktop/**"
      - ".github/workflows/build-pdv-desktop.yml"

permissions:
  contents: write # necessario pro softprops/action-gh-release publicar a Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdv-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pdv-desktop/package-lock.json

      # npm ci exige que package-lock.json bata exatamente com package.json — o lockfile
      # deste projeto ficou desatualizado por muito tempo (o build local nunca rodou aqui
      # pra regeneralo, por causa do bloqueio de symlink). npm install e mais tolerante e
      # corrige isso sozinho.
      #
      # O download do binario do Electron (~200MB, baixado pelo postinstall do pacote
      # "electron") as vezes esbarra num 504 Gateway Timeout do servidor de origem — falha
      # de rede pontual, nao do projeto. Repete algumas vezes antes de desistir.
      - name: Install dependencies (com retry pra download do Electron)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm install && exit 0
            echo "npm install falhou (tentativa $i/5), tentando de novo em 15s..."
            sleep 15
          done
          exit 1

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdv-desktop-installers
          path: |
            pdv-desktop/dist-installer/*.exe
          if-no-files-found: error

      - name: Ler versão do app
        id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publica os instaladores como assets de uma Release pública — link direto, sem
      # precisar de login no GitHub nem de eu copiar o arquivo manualmente pra algum lugar.
      # O nome do arquivo (artifactName no package.json) não leva a versão, então o link
      # "latest/download/<nome>" da tela de Downloads nunca precisa mudar entre versões.
      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Box Sys PDV v${{ steps.pkg.outputs.version }}
          make_latest: true
          files: pdv-desktop/dist-installer/*.exe
