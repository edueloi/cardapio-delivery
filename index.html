<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MenuFlow | Cardápio Digital</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    
    <link rel="icon" type="image/png" href="/images/favicon-menu-flow.png" />
    <link rel="apple-touch-icon" href="/images/app_celular.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MenuFlow" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{IMAGE}}" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="{{TITLE}}" />
    <meta property="twitter:description" content="{{DESCRIPTION}}" />
    <meta property="twitter:image" content="{{IMAGE}}" />
  </head>
  <body>
    <div id="pwa-splash">
      <img src="/images/app_celular.png" alt="MenuFlow" />
    </div>
    <div id="root"></div>
    <script>
      var splash = document.getElementById('pwa-splash');
      if (splash) {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
        if (!isStandalone) {
          splash.remove();
        } else {
          splash.addEventListener('animationend', function() { splash.remove(); });
          setTimeout(function() { splash.remove(); }, 3000);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
