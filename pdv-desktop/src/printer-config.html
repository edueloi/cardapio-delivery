<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Configurar Impressora</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: #0D1B3E;
    color: #fff;
    padding: 24px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; margin: 0; }
  p.hint { font-size: 12px; color: rgba(255,255,255,0.5); margin: 4px 0 0; line-height: 1.5; }
  label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.4); }
  select, .seg {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }
  .row { display: flex; flex-direction: column; gap: 6px; }
  .seg-group { display: flex; gap: 8px; }
  .seg-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
  }
  .seg-btn.active { background: #C9A227; color: #000; border-color: #C9A227; }
  .actions { margin-top: auto; display: flex; gap: 10px; }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  .btn-primary { background: #C9A227; color: #000; }
  .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); }
  .status { font-size: 12px; font-weight: 700; min-height: 18px; line-height: 1.5; word-break: break-word; max-height: 90px; overflow-y: auto; }
  .status.ok { color: #4ade80; }
  .status.error { color: #f87171; }
</style>
</head>
<body>
  <div>
    <h1>Configurar Impressora</h1>
    <p class="hint">Escolha a impressora térmica instalada no Windows (Configurações &gt; Impressoras) e teste antes de usar no PDV.</p>
  </div>

  <div class="row">
    <label>Impressora</label>
    <select id="printerSelect"></select>
  </div>

  <div class="row">
    <label>Largura da bobina</label>
    <div class="seg-group">
      <div class="seg-btn" data-width="80" id="btn80">80mm</div>
      <div class="seg-btn" data-width="58" id="btn58">58mm</div>
    </div>
  </div>

  <p class="status" id="status"></p>

  <div class="actions">
    <button class="btn-secondary" id="closeBtn">Fechar</button>
    <button class="btn-primary" id="testBtn">Testar Impressão</button>
  </div>

  <script>
    const selectEl = document.getElementById("printerSelect");
    const statusEl = document.getElementById("status");
    const btn80 = document.getElementById("btn80");
    const btn58 = document.getElementById("btn58");
    let currentWidth = 80;

    function setWidth(w) {
      currentWidth = w;
      btn80.classList.toggle("active", w === 80);
      btn58.classList.toggle("active", w === 58);
    }

    btn80.addEventListener("click", () => { setWidth(80); saveConfig(); });
    btn58.addEventListener("click", () => { setWidth(58); saveConfig(); });

    async function saveConfig() {
      await window.printerConfig.set({ name: selectEl.value, widthMm: currentWidth });
    }

    selectEl.addEventListener("change", saveConfig);

    document.getElementById("closeBtn").addEventListener("click", () => window.printerConfig.close());

    document.getElementById("testBtn").addEventListener("click", async () => {
      statusEl.textContent = "Imprimindo...";
      statusEl.className = "status";
      const result = await window.printerConfig.test();
      if (result.ok) {
        statusEl.textContent = "Impressão de teste enviada!";
        statusEl.className = "status ok";
      } else {
        statusEl.textContent = result.error || "Falha ao imprimir.";
        statusEl.className = "status error";
      }
    });

    (async () => {
      const [printers, config] = await Promise.all([
        window.printerConfig.list(),
        window.printerConfig.get(),
      ]);

      selectEl.innerHTML = "";
      if (printers.length === 0) {
        const opt = document.createElement("option");
        opt.textContent = "Nenhuma impressora encontrada";
        opt.value = "";
        selectEl.appendChild(opt);
      } else {
        for (const p of printers) {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = p.displayName || p.name;
          selectEl.appendChild(opt);
        }
      }
      if (config?.name) selectEl.value = config.name;
      setWidth(config?.widthMm === 58 ? 58 : 80);
    })();
  </script>
</body>
</html>
